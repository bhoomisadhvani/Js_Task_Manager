<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <title>Task manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container mt-4">
      <header>
        <h1 class="m-auto mt-3 text-center">Task Manager</h1>
        <p class="text-center">Organize your tasks and manage your time!</p>
      </header>

      <section class="form-section">
        <h2 id="formHeading">Add New Task</h2>

        <form id="taskForm">
          <div class="form-group">
            <label for="title">Task </label>
            <input
              type="text"
              id="title"
              placeholder="Enter Your Task"
              required
            />
          </div>
          <br />
          <div class="form-group">
            <label for="description">Description</label>
            <textarea
              id="description"
              placeholder="Enter description"
            ></textarea>
          </div>
          <br>


          <div class="form-group">
            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate" required />
          </div>

          <br>
          <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <br />
          <button type="submit" id="submitBtn" class="add-btn">Add Task</button>

          <button type="button" id="cancelBtn" class="cancel-btn" hidden>
            Cancel Edit
          </button>
        </form>
      </section>

      <section class="tasks-section">
        <h2>My Tasks</h2>

        <div class="filters mb-4">
          <input type="text" id="searchInput" placeholder="Search tasks..." />

          <select id="priorityFilter">
            <option value="all">All Priorities</option>
            <option value="low">Low Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="high">High Priority</option>
          </select>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Task</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="taskList"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    <script src="./script.js"></script>
  </body>
</html>
